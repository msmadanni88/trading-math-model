name: live

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub starts scheduled jobs when it has capacity: expect every 5-15 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      # candles, forecasts, reports and the files the site reads live as text
      # files on the `state` branch
      - name: Restore state branch
        id: restore
        run: |
          set +e
          git ls-remote --exit-code --heads "$REMOTE" state >/dev/null 2>&1
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            git clone -q --depth 1 --branch state "$REMOTE" state
          elif [ $rc -eq 2 ]; then
            echo "no state branch yet: this run downloads the history and replays it"
            mkdir state
            git -C state init -q -b state
            git -C state remote add origin "$REMOTE"
          else
            echo "cannot reach the repository (rc=$rc); stopping so nothing is overwritten"
            exit 1
          fi

      # the fitted models (binary) live in the Actions cache; if it is ever lost
      # the engine is rebuilt from the candles automatically
      - name: Restore fitted engine
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: engine-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: engine-v2-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Learn from the new candles and generate the next one
        id: run
        run: python -m probcast.run step --state-dir state --cache-dir cache

      - name: Save state branch
        if: always() && steps.restore.outcome == 'success'
        run: |
          cd state
          ls candles/*.csv >/dev/null 2>&1 || { echo "nothing to save"; exit 0; }
          git config user.name "model-bot"
          git config user.email "model-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -q -m "state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:state

      - name: Save fitted engine
        if: success() && steps.run.outputs.save_cache == 'true'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: engine-v2-${{ github.run_id }}-${{ github.run_attempt }}
